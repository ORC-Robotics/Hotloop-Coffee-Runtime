<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hotloop - Coffee Runtime</title>
  <desc id="desc">Decorative Hotloop release banner with the official coffee logo integrated on the left.</desc>
  <defs>
    <linearGradient id="bg" x1="48" y1="22" x2="1352" y2="338" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0D12"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="coffeeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(278 150) rotate(23) scale(286 188)">
      <stop stop-color="#8B5A3C" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8B5A3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="signalGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1088 122) rotate(145) scale(302 194)">
      <stop stop-color="#3D8BFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3D8BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoFrame" x1="74" y1="78" x2="246" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151A21"/>
      <stop offset="1" stop-color="#0D1015"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="1376" height="336" rx="30" fill="url(#bg)" stroke="#242A34" stroke-width="2"/>
  <rect x="24" y="24" width="1352" height="312" rx="22" fill="url(#coffeeGlow)"/>
  <rect x="24" y="24" width="1352" height="312" rx="22" fill="url(#signalGlow)"/>

  <g opacity="0.88">
    <path d="M312 88H396" stroke="#344154" stroke-width="2" stroke-linecap="round"/>
    <path d="M1170 88H1328" stroke="#344154" stroke-width="2" stroke-linecap="round"/>
    <path d="M1084 278H1328" stroke="#344154" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="68" y="74" width="182" height="182" rx="40" fill="url(#logoFrame)" stroke="#344154" stroke-width="2"/>
    <rect x="84" y="90" width="150" height="150" rx="32" fill="#0A0D12" stroke="#242A34"/>
    <image href="https://raw.githubusercontent.com/ORC-Robotics/Hotloop-Coffee-Runtime/main/frontend/src/assets/app-logo-official.png" x="96" y="86" width="126" height="160" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g>
    <rect x="288" y="70" width="194" height="32" rx="16" fill="#101317" stroke="#344154"/>
    <circle cx="312" cy="86" r="6" fill="#7CCB52"/>
    <text x="330" y="91" fill="#D7DDE8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0.18em">COFFEE RUNTIME</text>
  </g>

  <text x="288" y="178" fill="#FFFFFF" font-family="'Archivo Black', 'Arial Black', sans-serif" font-size="98" letter-spacing="-0.06em">Hotloop</text>
  <text x="292" y="220" fill="#8F98AA" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="0.16em">OPERATOR TELEMETRY CONSOLE</text>
  <text x="292" y="262" fill="#D7DDE8" font-family="Arial, Helvetica, sans-serif" font-size="22">
    Live telemetry and configurable workspaces.
  </text>
  <text x="292" y="292" fill="#D7DDE8" font-family="Arial, Helvetica, sans-serif" font-size="22">
    Simulation mode and desktop delivery for Windows and Linux.
  </text>

  <g>
    <rect x="1038" y="70" width="254" height="46" rx="23" fill="#101317" stroke="#242A34"/>
    <circle cx="1068" cy="93" r="7" fill="#8B5A3C"/>
    <text x="1088" y="100" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Hotloop Release</text>
  </g>

  <g>
    <rect x="942" y="252" width="116" height="42" rx="21" fill="#101317" stroke="#242A34"/>
    <text x="972" y="279" fill="#D7DDE8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Desktop</text>

    <rect x="1074" y="252" width="134" height="42" rx="21" fill="#101317" stroke="#242A34"/>
    <text x="1108" y="279" fill="#D7DDE8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Simulation</text>

    <rect x="1222" y="252" width="106" height="42" rx="21" fill="#101317" stroke="#242A34"/>
    <text x="1250" y="279" fill="#D7DDE8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Builder</text>
  </g>
</svg>
