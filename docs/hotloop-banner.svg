<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hotloop - Coffee Runtime</title>
  <desc id="desc">Decorative release banner for the Hotloop operator console.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="24" x2="1136" y2="296" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0D12"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="coffeeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(302 128) rotate(31.5) scale(288 166)">
      <stop stop-color="#8B5A3C" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8B5A3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="signalGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 96) rotate(142.4) scale(246 142)">
      <stop stop-color="#3D8BFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3D8BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="12" y="12" width="1176" height="296" rx="28" fill="url(#bg)" stroke="#242A34" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="272" rx="20" fill="url(#coffeeGlow)"/>
  <rect x="24" y="24" width="1152" height="272" rx="20" fill="url(#signalGlow)"/>

  <g opacity="0.88">
    <path d="M69 86H196" stroke="#344154" stroke-width="2" stroke-linecap="round"/>
    <path d="M69 234H244" stroke="#344154" stroke-width="2" stroke-linecap="round"/>
    <path d="M1024 86H1131" stroke="#344154" stroke-width="2" stroke-linecap="round"/>
    <path d="M974 234H1131" stroke="#344154" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="72" y="64" width="160" height="30" rx="15" fill="#101317" stroke="#344154"/>
    <circle cx="95" cy="79" r="6" fill="#7CCB52"/>
    <text x="112" y="84" fill="#D7DDE8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0.18em">COFFEE RUNTIME</text>
  </g>

  <text x="72" y="168" fill="#FFFFFF" font-family="'Archivo Black', 'Arial Black', sans-serif" font-size="92" letter-spacing="-0.06em">Hotloop</text>
  <text x="76" y="212" fill="#8F98AA" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="0.16em">OPERATOR TELEMETRY CONSOLE</text>
  <text x="76" y="252" fill="#D7DDE8" font-family="Arial, Helvetica, sans-serif" font-size="22">
    Live telemetry, configurable workspaces, simulation mode, and desktop delivery for Windows and Linux.
  </text>

  <g>
    <rect x="862" y="58" width="246" height="46" rx="23" fill="#101317" stroke="#242A34"/>
    <circle cx="890" cy="81" r="7" fill="#8B5A3C"/>
    <text x="908" y="88" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Hotloop Release</text>
  </g>

  <g>
    <rect x="754" y="194" width="112" height="42" rx="21" fill="#101317" stroke="#242A34"/>
    <text x="782" y="221" fill="#D7DDE8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Desktop</text>

    <rect x="880" y="194" width="126" height="42" rx="21" fill="#101317" stroke="#242A34"/>
    <text x="914" y="221" fill="#D7DDE8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Simulation</text>

    <rect x="1020" y="194" width="106" height="42" rx="21" fill="#101317" stroke="#242A34"/>
    <text x="1048" y="221" fill="#D7DDE8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Builder</text>
  </g>
</svg>
