name: Solicitar feature
description: Propor uma nova capacidade de produto, UX ou integração.
title: "[Feature] "
labels:
  - enhancement
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        Use este template para propor melhorias no produto, novos painéis, fluxos operacionais ou integrações.
  - type: textarea
    id: problem
    attributes:
      label: Problema ou oportunidade
      description: Qual necessidade esta feature resolve?
      placeholder: Hoje é difícil...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Descreva a solução desejada.
      placeholder: Gostaria que o dashboard...
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Valor operacional
      description: Como isso ajuda o operador, o debug ou a integração?
      placeholder: Isso melhora...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área principal
      options:
        - frontend
        - bridge
        - integração com o robô
        - visual/UX
        - arquitetura
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridade sugerida
      options:
        - p0
        - p1
        - p2
  - type: textarea
    id: notes
    attributes:
      label: Referências ou observações
      description: Links, prints, sketches, decisões de produto ou detalhes técnicos.
