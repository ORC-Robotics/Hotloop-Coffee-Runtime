name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build portable desktop executable
        working-directory: frontend
        run: npm run build:desktop

      - name: Resolve app version
        id: app_version
        shell: pwsh
        run: |
          $packageJson = Get-Content "frontend/package.json" | ConvertFrom-Json
          "version=$($packageJson.version)" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Console-${{ steps.app_version.outputs.version }}-windows-portable
          path: frontend/release/ORION Console ${{ steps.app_version.outputs.version }}.exe
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/release/ORION Console ${{ steps.app_version.outputs.version }}.exe
          generate_release_notes: true
